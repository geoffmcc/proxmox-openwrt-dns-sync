name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n proxmox-sync.sh notify-failure.sh clear-failure.sh
          sh -n openwrt-receiver.sh
      - name: Run offline sender tests
        run: python3 -m unittest discover -s tests -v
